<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3498db;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2c3e50;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="#f8f9fa" />
  
  <!-- Network visualization representation -->
  <g transform="translate(300, 200)">
    <!-- Central node (representing consciousness interface) -->
    <circle cx="0" cy="0" r="40" fill="url(#grad1)" />
    <text x="0" y="5" font-family="Arial" font-size="12" fill="white" text-anchor="middle">آگاهی</text>
    
    <!-- Nodes representing humans -->
    <g>
      <circle cx="-120" cy="-80" r="20" fill="#3498db" />
      <line x1="-120" y1="-80" x2="0" y2="0" stroke="#ccc" stroke-width="2" />
      <text x="-120" y="-80" font-family="Arial" font-size="10" fill="white" text-anchor="middle">انسان ۱</text>
    </g>
    
    <g>
      <circle cx="100" cy="-90" r="25" fill="#3498db" />
      <line x1="100" y1="-90" x2="0" y2="0" stroke="#ccc" stroke-width="3" />
      <text x="100" y="-90" font-family="Arial" font-size="10" fill="white" text-anchor="middle">انسان ۲</text>
    </g>
    
    <g>
      <circle cx="130" cy="50" r="18" fill="#3498db" />
      <line x1="130" y1="50" x2="0" y2="0" stroke="#ccc" stroke-width="2" />
      <text x="130" y="50" font-family="Arial" font-size="10" fill="white" text-anchor="middle">انسان ۳</text>
    </g>
    
    <g>
      <circle cx="-90" cy="100" r="22" fill="#3498db" />
      <line x1="-90" y1="100" x2="0" y2="0" stroke="#ccc" stroke-width="2.5" />
      <text x="-90" y="100" font-family="Arial" font-size="10" fill="white" text-anchor="middle">انسان ۴</text>
    </g>
    
    <g>
      <circle cx="-150" cy="20" r="15" fill="#3498db" />
      <line x1="-150" y1="20" x2="0" y2="0" stroke="#ccc" stroke-width="1.5" />
      <text x="-150" y="20" font-family="Arial" font-size="10" fill="white" text-anchor="middle">انسان ۵</text>
    </g>
    
    <!-- Connections between humans -->
    <line x1="-120" y1="-80" x2="100" y2="-90" stroke="#ccc" stroke-width="1" stroke-dasharray="5,5" />
    <line x1="100" y1="-90" x2="130" y2="50" stroke="#ccc" stroke-width="1" stroke-dasharray="5,5" />
    <line x1="130" y1="50" x2="-90" y2="100" stroke="#ccc" stroke-width="1" stroke-dasharray="5,5" />
    <line x1="-90" y1="100" x2="-150" y2="20" stroke="#ccc" stroke-width="1" stroke-dasharray="5,5" />
    <line x1="-150" y1="20" x2="-120" y2="-80" stroke="#ccc" stroke-width="1" stroke-dasharray="5,5" />
  </g>
  
  <!-- Title -->
  <text x="300" y="30" font-family="Arial" font-size="20" fill="#2c3e50" text-anchor="middle" font-weight="bold">مدل سایبرنتیک شناختی</text>
  <text x="300" y="60" font-family="Arial" font-size="16" fill="#3498db" text-anchor="middle">با رابط کاربری مبتنی بر آگاهی</text>
</svg>
