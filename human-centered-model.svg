<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3498db;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2c3e50;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="#f8f9fa" />
  
  <!-- Network representation -->
  <g transform="translate(300, 200)">
    <!-- Nodes representing humans -->
    <g>
      <circle cx="-150" cy="-100" r="20" fill="#3498db" />
      <text x="-150" y="-100" font-family="Arial" font-size="10" fill="white" text-anchor="middle">انسان ۱</text>
    </g>
    
    <g>
      <circle cx="-50" cy="-120" r="25" fill="#3498db" />
      <text x="-50" y="-120" font-family="Arial" font-size="10" fill="white" text-anchor="middle">انسان ۲</text>
    </g>
    
    <g>
      <circle cx="70" cy="-110" r="18" fill="#3498db" />
      <text x="70" y="-110" font-family="Arial" font-size="10" fill="white" text-anchor="middle">انسان ۳</text>
    </g>
    
    <g>
      <circle cx="150" cy="-60" r="22" fill="#3498db" />
      <text x="150" y="-60" font-family="Arial" font-size="10" fill="white" text-anchor="middle">انسان ۴</text>
    </g>
    
    <g>
      <circle cx="170" cy="40" r="15" fill="#3498db" />
      <text x="170" y="40" font-family="Arial" font-size="10" fill="white" text-anchor="middle">انسان ۵</text>
    </g>
    
    <g>
      <circle cx="100" cy="100" r="23" fill="#3498db" />
      <text x="100" y="100" font-family="Arial" font-size="10" fill="white" text-anchor="middle">انسان ۶</text>
    </g>
    
    <g>
      <circle cx="0" cy="130" r="19" fill="#3498db" />
      <text x="0" y="130" font-family="Arial" font-size="10" fill="white" text-anchor="middle">انسان ۷</text>
    </g>
    
    <g>
      <circle cx="-100" cy="110" r="21" fill="#3498db" />
      <text x="-100" y="110" font-family="Arial" font-size="10" fill="white" text-anchor="middle">انسان ۸</text>
    </g>
    
    <g>
      <circle cx="-170" cy="50" r="17" fill="#3498db" />
      <text x="-170" y="50" font-family="Arial" font-size="10" fill="white" text-anchor="middle">انسان ۹</text>
    </g>
    
    <g>
      <circle cx="-180" cy="-30" r="24" fill="#3498db" />
      <text x="-180" y="-30" font-family="Arial" font-size="10" fill="white" text-anchor="middle">انسان ۱۰</text>
    </g>
    
    <!-- Connections between humans -->
    <line x1="-150" y1="-100" x2="-50" y2="-120" stroke="#ccc" stroke-width="2" />
    <line x1="-50" y1="-120" x2="70" y2="-110" stroke="#ccc" stroke-width="2" />
    <line x1="70" y1="-110" x2="150" y2="-60" stroke="#ccc" stroke-width="2" />
    <line x1="150" y1="-60" x2="170" y2="40" stroke="#ccc" stroke-width="2" />
    <line x1="170" y1="40" x2="100" y2="100" stroke="#ccc" stroke-width="2" />
    <line x1="100" y1="100" x2="0" y2="130" stroke="#ccc" stroke-width="2" />
    <line x1="0" y1="130" x2="-100" y2="110" stroke="#ccc" stroke-width="2" />
    <line x1="-100" y1="110" x2="-170" y2="50" stroke="#ccc" stroke-width="2" />
    <line x1="-170" y1="50" x2="-180" y2="-30" stroke="#ccc" stroke-width="2" />
    <line x1="-180" y1="-30" x2="-150" y2="-100" stroke="#ccc" stroke-width="2" />
    
    <!-- Additional connections to show network density -->
    <line x1="-150" y1="-100" x2="70" y2="-110" stroke="#ccc" stroke-width="1" stroke-dasharray="5,5" />
    <line x1="-50" y1="-120" x2="150" y2="-60" stroke="#ccc" stroke-width="1" stroke-dasharray="5,5" />
    <line x1="70" y1="-110" x2="100" y2="100" stroke="#ccc" stroke-width="1" stroke-dasharray="5,5" />
    <line x1="150" y1="-60" x2="0" y2="130" stroke="#ccc" stroke-width="1" stroke-dasharray="5,5" />
    <line x1="170" y1="40" x2="-100" y2="110" stroke="#ccc" stroke-width="1" stroke-dasharray="5,5" />
    <line x1="-180" y1="-30" x2="-50" y2="-120" stroke="#ccc" stroke-width="1" stroke-dasharray="5,5" />
    <line x1="-170" y1="50" x2="0" y2="130" stroke="#ccc" stroke-width="1" stroke-dasharray="5,5" />
  </g>
  
  <!-- Title -->
  <text x="300" y="30" font-family="Arial" font-size="20" fill="#2c3e50" text-anchor="middle" font-weight="bold">مدل عام‌محور انسان‌محور</text>
  <text x="300" y="60" font-family="Arial" font-size="16" fill="#3498db" text-anchor="middle">نمایش انسان‌ها به عنوان نقاط در شبکه</text>
</svg>
