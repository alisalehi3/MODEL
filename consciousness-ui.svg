<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3498db;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2c3e50;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="#f8f9fa" />
  
  <!-- Consciousness-based UI representation -->
  <g transform="translate(300, 200)">
    <!-- Four layers of consciousness interface -->
    <circle cx="0" cy="0" r="120" fill="none" stroke="#3498db" stroke-width="1" stroke-dasharray="5,5" />
    <circle cx="0" cy="0" r="90" fill="none" stroke="#3498db" stroke-width="1" stroke-dasharray="5,5" />
    <circle cx="0" cy="0" r="60" fill="none" stroke="#3498db" stroke-width="1" stroke-dasharray="5,5" />
    <circle cx="0" cy="0" r="30" fill="url(#grad1)" />
    
    <!-- Layer labels -->
    <text x="0" y="-125" font-family="Arial" font-size="12" fill="#3498db" text-anchor="middle">لایه جمع‌آوری داده</text>
    <text x="0" y="-95" font-family="Arial" font-size="12" fill="#3498db" text-anchor="middle">لایه پردازش و تحلیل</text>
    <text x="0" y="-65" font-family="Arial" font-size="12" fill="#3498db" text-anchor="middle">لایه تصمیم‌گیری</text>
    <text x="0" y="5" font-family="Arial" font-size="12" fill="white" text-anchor="middle">لایه پاسخ و تعامل</text>
    
    <!-- Data flow arrows -->
    <path d="M0,-120 L0,-90" stroke="#3498db" stroke-width="2" marker-end="url(#arrow)" />
    <path d="M0,-90 L0,-60" stroke="#3498db" stroke-width="2" marker-end="url(#arrow)" />
    <path d="M0,-60 L0,-30" stroke="#3498db" stroke-width="2" marker-end="url(#arrow)" />
  </g>
  
  <!-- Title -->
  <text x="300" y="30" font-family="Arial" font-size="20" fill="#2c3e50" text-anchor="middle" font-weight="bold">رابط کاربری مبتنی بر آگاهی</text>
  <text x="300" y="60" font-family="Arial" font-size="16" fill="#3498db" text-anchor="middle">معماری چهار لایه</text>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#3498db" />
    </marker>
  </defs>
</svg>
